name: Deploy CabinetScan AI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'sample_dossier.html'
      - 'sample_cabinetscan_dossier.pdf'
      - 'cabinetscan_doctor_briefing.mp4'
      - 'doctor_poster.jpg'
      - 'dr_elena_talking_avatar.mp4'
      - 'logo.png'
      - 'logo_3d.jpg'
      - 'cabinetscan_logo_luxury.png'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Deploy to GitHub Pages CDN
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
